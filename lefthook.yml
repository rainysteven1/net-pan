commit-msg:
  commands:
    conventional-commit:
      run: |
        message="$(cat {1})"
        echo "$message" | grep -qiE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?(!)?: .+|^first commit$' || {
          echo "Commit message must follow Conventional Commits." >&2
          exit 1
        }

pre-commit:
  parallel: false
  commands:
    privacy:
      run: ./scripts/privacy-check.sh
    format:
      run: ./scripts/format.sh --check
    check:
      run: ./scripts/check.sh --pre-commit --skip-privacy --skip-fmt
